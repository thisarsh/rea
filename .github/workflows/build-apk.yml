name: Build ReA Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        id: build_apk
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to GitHub Releases
        if: steps.build_apk.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          gh release create "$TAG" "$APK_PATH" \
            --title "ReA Mobile v1.0.${{ github.run_number }}" \
            --notes "Automated Android APK pointing to https://reakcc.netlify.app/ (built from commit ${{ github.sha }})." || true

      - name: Prune Previous APK Artifacts
        if: steps.build_apk.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do
            [ -n "$id" ] || continue
            echo "Deleting previous artifact ID: $id"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload Latest APK as GitHub Actions Artifact
        if: steps.build_apk.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
